<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAL Scene Transition Prototype V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans SC","Microsoft YaHei","Segoe UI",Arial,sans-serif;background:#263b55}.page{min-height:100vh;padding:28px;background:#263b55;display:flex}.frame{flex:1;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:#405b78;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px}.cn{font-size:38px;font-weight:800;margin:0 0 18px}.nl{font-size:24px;margin:0;color:#f4f7fb}
@media(max-width:700px){.cn{font-size:30px}.nl{font-size:20px}}
</style>
</head>
<body>
<!-- CD implementation rule: show this fixed transition screen for exactly 2 seconds, then render the next scene. -->
<div class="page"><div class="frame"><div>
  <p class="cn">你正进入下一个场景</p>
  <p class="nl">Je gaat nu naar de volgende scène.</p>
</div></div></div>
</body>
</html>
