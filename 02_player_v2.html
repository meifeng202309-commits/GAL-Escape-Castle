<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Doors V2</title>
<style>
body{font-family:Arial,sans-serif;background:#111827;color:white;margin:0}
.wrap{max-width:720px;margin:40px auto;padding:20px}
.card{background:#1f2937;border-radius:16px;padding:24px;margin-bottom:18px}
input,select,button{font-size:16px;padding:12px;margin:6px;border-radius:8px;border:1px solid #555}
button{cursor:pointer}
.option{display:block;width:100%;margin:10px 0;text-align:left}
.hidden{display:none}
.muted{color:#aaa}
.good{color:#86efac}
.wait{color:#fde68a}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Three Doors V2</h1>
    <p class="muted">No external JS library. Direct Supabase REST test.</p>
  </div>

  <div id="joinCard" class="card">
    <input id="room" value="5832" placeholder="Room code">
    <select id="player">
      <option>GAL-A</option>
      <option>GAL-B</option>
      <option>GAL-C</option>
    </select>
    <button id="joinBtn">Join</button>
    <p id="status" class="muted"></p>
  </div>

  <div id="gameCard" class="card hidden">
    <div id="game"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qdcbdcjobzytzhnhfwyn.supabase.co";
const SUPABASE_KEY = "sb_publishable_h5mCF6rkaYWw12ssP4-1NA_KzzPJOwY";
const API = SUPABASE_URL + "/rest/v1/game_choices";

let room = "";
let player = "";
let currentScene = 1;
let pollTimer = null;
let transitionTimer = null;

document.getElementById("joinBtn").addEventListener("click", joinGame);

function headers(extra={}){
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  }, extra);
}

async function getRoomRows(){
  let res;
  try {
    res = await fetch(API + "?room_code=eq." + encodeURIComponent(room) + "&select=*", {
      method: "GET",
      headers: headers()
    });
  } catch(err) {
    throw new Error(networkHint(err));
  }
  if(!res.ok) throw new Error(await res.text());
  return await res.json();
}

async function joinGame(){
  try {
    room = document.getElementById("room").value.trim().toUpperCase();
    player = document.getElementById("player").value;
    if(!room) return;

    document.getElementById("status").textContent = "Connecting...";
    const rows = await getRoomRows();

    const s1 = rows.filter(r => r.scene === 1).length;
    const s2 = rows.filter(r => r.scene === 2).length;
    currentScene = s2 >= 3 ? 3 : (s1 >= 3 ? 2 : 1);

    document.getElementById("joinCard").classList.add("hidden");
    document.getElementById("gameCard").classList.remove("hidden");
    document.getElementById("status").textContent = "";

    await refresh();
    pollTimer = setInterval(refresh, 1000);
  } catch(err) {
    document.getElementById("status").textContent = "Connection failed: " + err.message;
  }
}

async function refresh(){
  try {
    const rows = await getRoomRows();
    render(rows);
  } catch(err) {
    document.getElementById("game").innerHTML = "<p style='color:#fca5a5'>Error: " + escapeHtml(err.message) + "</p>";
  }
}

function render(rows){
  const game = document.getElementById("game");

  if(currentScene === 3){
    game.innerHTML = "<h2>Mission complete</h2><p class='good'>Scene transition and data logging worked.</p>";
    return;
  }

  const sceneRows = rows.filter(r => r.scene === currentScene);
  const mine = sceneRows.find(r => r.player_name === player);

  const sceneData = currentScene === 1
    ? {title:"Scene 1 — Three Doors", text:"You are trapped in a room. Choose privately.", opts:["Red Door","Blue Door","Black Door"]}
    : {title:"Scene 2 — Footsteps", text:"Footsteps are getting closer behind you. What do you do?", opts:["Run","Hide","Call the others"]};

  if(sceneRows.length >= 3){
    const ordered = ["GAL-A","GAL-B","GAL-C"].map(p => sceneRows.find(r => r.player_name === p));
    game.innerHTML = "<h2>" + sceneData.title + "</h2><h3>Choices revealed</h3>" +
      ordered.map(r => "<p>" + r.player_name + " → <b>" + escapeHtml(r.choice) + "</b></p>").join("") +
      "<p class='good'>All 3 players submitted.</p><p class='muted'>Moving on...</p>";

    if(!transitionTimer){
      transitionTimer = setTimeout(() => {
        currentScene++;
        transitionTimer = null;
        refresh();
      }, 3000);
    }
    return;
  }

  let html = "<h2>" + sceneData.title + "</h2><p>" + sceneData.text + "</p>";

  if(mine){
    html += "<p class='good'>You chose: <b>" + escapeHtml(mine.choice) + "</b></p>";
    html += "<p class='wait'>Waiting for the other players... (" + sceneRows.length + "/3)</p>";
  } else {
    html += sceneData.opts.map(opt =>
      "<button class='option' data-choice='" + escapeAttr(opt) + "'>" + escapeHtml(opt) + "</button>"
    ).join("");
    html += "<p class='muted'>" + sceneRows.length + "/3 submitted</p>";
  }

  game.innerHTML = html;

  document.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => submitChoice(btn.dataset.choice));
  });
}

async function submitChoice(choice){
  try {
    document.querySelectorAll(".option").forEach(b => b.disabled = true);

    let res;
    try {
      res = await fetch(API, {
        method: "POST",
        headers: headers({"Prefer":"return=minimal"}),
        body: JSON.stringify({
          room_code: room,
          player_name: player,
          scene: currentScene,
          choice: choice
        })
      });
    } catch(err) {
      throw new Error(networkHint(err));
    }

    if(!res.ok){
      const txt = await res.text();
      if(!txt.includes("duplicate key")) throw new Error(txt);
    }

    await refresh();
  } catch(err) {
    alert("Submit failed: " + err.message);
    document.querySelectorAll(".option").forEach(b => b.disabled = false);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}
function escapeAttr(s){
  return escapeHtml(s);
}
function networkHint(err){
  const detail = err && err.message ? err.message : String(err);
  return detail + ". Network request could not reach Supabase. Do not open this file with file://; run 04_start_server.bat and open http://127.0.0.1:8000/02_player_v2.html. If it still fails, check DNS/proxy/firewall access to qdcbdcjobzytzhnhfwyn.supabase.co.";
}
</script>
</body>
</html>
