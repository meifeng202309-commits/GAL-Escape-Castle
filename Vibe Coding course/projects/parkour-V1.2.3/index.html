<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkour V1.2.3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#ffe6f1;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100vh}#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 15px;border-radius:18px;background:#ffffffc8;color:#203040}</style></head><body><canvas id="game"></canvas><div id="hint">SPACE / ↑ 跳跃　　↓ 趴下 / 滑铲　　R 重新开始</div><script>
const c=document.getElementById("game"),x=c.getContext("2d");let W,H,gY,S=1,G;const cityBg=new Image();cityBg.src="assets/city-night-loop.jpg";
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;gY=H*.78;S=Math.max(.75,Math.min(1.25,H/720))}addEventListener("resize",resize);resize();
function reset(){G={t:0,score:0,speed:390*S,over:false,next:1.4,obs:[],p:{x:W*.18,y:gY,vy:0,on:true,slide:false,st:0,run:0}}}reset();
addEventListener("keydown",e=>{if(["Space","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();if(G.over&&(e.code==="KeyR"||e.code==="Space"))return reset();let p=G.p;if(!G.over&&(e.code==="Space"||e.code==="ArrowUp")&&p.on&&!p.slide){p.vy=-650*S;p.on=false}if(!G.over&&e.code==="ArrowDown"&&p.on){p.slide=true;p.st=.55}});
function spawn(){let high=Math.random()<.42;G.obs.push(high?{type:"high",x:W+80,w:78*S,top:gY-112*S,bottom:gY-58*S}:{type:"low",x:W+80,w:54*S,h:62*S});G.next=.75+Math.random()*.75}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function pb(){let p=G.p;return p.slide?{x:p.x-22*S,y:p.y-35*S,w:78*S,h:31*S}:{x:p.x-18*S,y:p.y-96*S,w:42*S,h:91*S}}
function update(dt){if(G.over)return;G.t+=dt;G.score+=dt*10;G.speed=Math.min(720*S,390*S+G.t*6.5*S);let p=G.p;p.run+=dt*(G.speed/55);p.vy+=1650*S*dt;p.y+=p.vy*dt;if(p.y>=gY){p.y=gY;p.vy=0;p.on=true}else p.on=false;if(p.slide){p.st-=dt;if(p.st<=0)p.slide=false}G.next-=dt;if(G.next<=0)spawn();for(let o of G.obs)o.x-=G.speed*dt;G.obs=G.obs.filter(o=>o.x>-150);let a=pb();for(let o of G.obs){let b=o.type==="low"?{x:o.x,y:gY-o.h,w:o.w,h:o.h}:{x:o.x,y:o.top,w:o.w,h:o.bottom-o.top};if(hit(a,b)){G.over=true;break}}}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function bg(){if(cityBg.complete&&cityBg.naturalWidth){let sc=H/cityBg.naturalHeight,bw=cityBg.naturalWidth*sc,off=-(G.t*G.speed*.12)%bw;x.drawImage(cityBg,off,0,bw,H);x.drawImage(cityBg,off+bw,0,bw,H);if(off>0)x.drawImage(cityBg,off-bw,0,bw,H)}else{x.fillStyle="#07152f";x.fillRect(0,0,W,H)}x.fillStyle="#273142";x.fillRect(0,gY,W,H-gY);x.fillStyle="#d7dce2";x.fillRect(0,gY+8,W,5)}
function person(){let p=G.p,s=S,q=p.x,y=p.y;x.save();x.lineCap="round";if(p.slide){x.strokeStyle="#182838";x.lineWidth=12*s;x.beginPath();x.moveTo(q-4*s,y-26*s);x.lineTo(q+34*s,y-18*s);x.lineTo(q+58*s,y-8*s);x.stroke();x.fillStyle="#efb07d";x.beginPath();x.arc(q-15*s,y-31*s,13*s,0,7);x.fill();x.fillStyle="#8b5cf6";rr(q-3*s,y-39*s,37*s,23*s,8*s)}else{let ph=Math.sin(p.run),lift=p.on?0:8*s;x.strokeStyle="#243044";x.lineWidth=11*s;x.beginPath();x.moveTo(q,y-43*s-lift);x.lineTo(q+ph*18*s,y-19*s);x.lineTo(q-ph*23*s,y-3*s);x.stroke();x.beginPath();x.moveTo(q+8*s,y-43*s-lift);x.lineTo(q-ph*17*s,y-22*s);x.lineTo(q+ph*26*s,y-4*s);x.stroke();x.fillStyle="#e6544f";rr(q-15*s,y-84*s-lift,37*s,43*s,10*s);x.strokeStyle="#efb07d";x.lineWidth=8*s;x.beginPath();x.moveTo(q-8*s,y-73*s-lift);x.lineTo(q+ph*19*s,y-56*s-lift);x.stroke();x.fillStyle="#efb07d";x.beginPath();x.arc(q+1*s,y-101*s-lift,14*s,0,7);x.fill();x.fillStyle="#293a66";x.beginPath();x.arc(q-2*s,y-106*s-lift,14*s,Math.PI,6.15);x.fill()}x.restore()}
function hurdle(o){let s=S;x.strokeStyle="#f2f2ef";x.lineWidth=6*s;if(o.type==="low"){x.beginPath();x.moveTo(o.x+8*s,gY);x.lineTo(o.x+8*s,gY-o.h);x.moveTo(o.x+o.w-8*s,gY);x.lineTo(o.x+o.w-8*s,gY-o.h);x.stroke();x.fillStyle="#f7f7f2";rr(o.x-2*s,gY-o.h,o.w+4*s,10*s,3*s);x.fillStyle="#df4d47";for(let i=0;i<4;i++)x.fillRect(o.x+i*15*s,gY-o.h,8*s,10*s)}else{x.beginPath();x.moveTo(o.x+5*s,gY);x.lineTo(o.x+5*s,o.top);x.moveTo(o.x+o.w-5*s,gY);x.lineTo(o.x+o.w-5*s,o.top);x.stroke();x.fillStyle="#f4f4ef";rr(o.x,o.top,o.w,11*s,3*s);x.fillStyle="#dd504a";for(let i=0;i<5;i++)x.fillRect(o.x+i*17*s,o.top,9*s,11*s)}}
function draw(){bg();for(let o of G.obs)hurdle(o);person();x.fillStyle="#122130b8";rr(22,20,190,68,14);x.fillStyle="#fff";x.font="700 18px Arial";x.fillText("PARKOUR V1.2.3",38,47);x.font="16px Arial";x.fillText("距离  "+Math.floor(G.score)+" m",38,73);if(G.over){x.fillStyle="#08101a8c";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#fff";x.font="800 48px Arial";x.fillText("GAME OVER",W/2,H*.39);x.font="22px Arial";x.fillText("距离："+Math.floor(G.score)+" m",W/2,H*.46);x.fillStyle="#fff";rr(W/2-115,H*.51,230,52,26);x.fillStyle="#203040";x.font="700 17px Arial";x.fillText("按 R 或 SPACE 重来",W/2,H*.51+33);x.textAlign="left"}}
let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
