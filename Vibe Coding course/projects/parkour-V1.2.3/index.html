<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkour V1.2.3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#dff3df;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}#h{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 15px;border-radius:18px;background:#ffffffcc}</style></head><body><canvas id="c"></canvas><div id="h">SPACE / ↑ 跳跃　　↓ 滑铲　　R 重新开始</div><script>
const c=document.querySelector("#c"),x=c.getContext("2d");let W,H,g,G,last=performance.now();const cityBg=new Image();cityBg.src="assets/city-night-loop.png";
function size(){c.width=innerWidth;c.height=innerHeight;W=c.width;H=c.height;g=H*.78}onresize=size;size();
function reset(){G={t:0,score:0,speed:330,over:0,next:1.4,o:[],p:{x:W*.18,y:g,vy:0,on:1,slide:0,st:0}}}reset();
onkeydown=e=>{if(G.over&&(e.code==="KeyR"||e.code==="Space"))return reset();let p=G.p;if((e.code==="Space"||e.code==="ArrowUp")&&p.on&&!p.slide){p.vy=-650;p.on=0}if(e.code==="ArrowDown"&&p.on){p.slide=1;p.st=.55}};
function spawn(){let high=Math.random()<.42;G.o.push(high?{t:1,x:W+80,w:78,top:g-112,bot:g-58}:{t:0,x:W+80,w:54,h:62});G.next=1.15+Math.random()*1.15}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(G.over)return;G.t+=dt;G.score+=dt*10;G.speed=Math.min(620,330+G.t*5.2);let p=G.p;p.vy+=1650*dt;p.y+=p.vy*dt;if(p.y>=g){p.y=g;p.vy=0;p.on=1}else p.on=0;if(p.slide&&(p.st-=dt)<=0)p.slide=0;if((G.next-=dt)<=0)spawn();G.o.forEach(o=>o.x-=G.speed*dt);G.o=G.o.filter(o=>o.x>-150);let a=p.slide?{x:p.x-22,y:p.y-35,w:78,h:31}:{x:p.x-18,y:p.y-96,w:42,h:91};for(let o of G.o){let b=o.t?{x:o.x,y:o.top,w:o.w,h:o.bot-o.top}:{x:o.x,y:g-o.h,w:o.w,h:o.h};if(hit(a,b))G.over=1}}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function draw(){if(cityBg.complete&&cityBg.naturalWidth){const scale=H/cityBg.naturalHeight,bw=cityBg.naturalWidth*scale,off=-(G.t*G.speed*.16)%bw;x.drawImage(cityBg,off,0,bw,H);x.drawImage(cityBg,off+bw,0,bw,H);if(off>0)x.drawImage(cityBg,off-bw,0,bw,H)}else rect(0,0,W,H,"#07152f");
for(let o of G.o){x.strokeStyle="#f5f5ef";x.lineWidth=6;if(o.t){x.beginPath();x.moveTo(o.x+5,g);x.lineTo(o.x+5,o.top);x.moveTo(o.x+o.w-5,g);x.lineTo(o.x+o.w-5,o.top);x.stroke();rect(o.x,o.top,o.w,11,"#2f855a")}else{x.beginPath();x.moveTo(o.x+8,g);x.lineTo(o.x+8,g-o.h);x.moveTo(o.x+o.w-8,g);x.lineTo(o.x+o.w-8,g-o.h);x.stroke();rect(o.x,g-o.h,o.w,11,"#2f855a")}}
let p=G.p;x.fillStyle="#1f7a4d";if(p.slide){rect(p.x-5,p.y-39,48,24,"#1f7a4d");x.fillStyle="#efb07d";x.beginPath();x.arc(p.x-15,p.y-31,13,0,7);x.fill()}else{rect(p.x-15,p.y-84,37,43,"#1f7a4d");x.strokeStyle="#243044";x.lineWidth=10;x.beginPath();x.moveTo(p.x,p.y-42);x.lineTo(p.x-15,p.y-3);x.moveTo(p.x+10,p.y-42);x.lineTo(p.x+24,p.y-3);x.stroke();x.fillStyle="#efb07d";x.beginPath();x.arc(p.x+1,p.y-101,14,0,7);x.fill()}
rect(22,20,205,68,"#173d2acc");x.fillStyle="white";x.font="700 18px Arial";x.fillText("PARKOUR V1.2.3",38,47);x.font="16px Arial";x.fillText("距离  "+Math.floor(G.score)+" m",38,73);if(G.over){rect(0,0,W,H,"#08101a99");x.textAlign="center";x.fillStyle="white";x.font="800 48px Arial";x.fillText("GAME OVER",W/2,H*.4);x.font="20px Arial";x.fillText("按 R 或 SPACE 重来",W/2,H*.49);x.textAlign="left"}}
function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
