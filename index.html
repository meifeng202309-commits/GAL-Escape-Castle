<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAL Castle Escape</title>
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<main class="shell">
  <section class="panel title-panel">
    <p class="eyebrow">GAL Castle Escape</p>
    <h1>The clock is ticking.</h1>
    <p class="muted">Join with the room code and role code your teacher gives you.</p>
  </section>

  <section id="joinPanel" class="panel">
    <div class="field-grid">
      <label>
        Room code
        <input id="roomCode" autocomplete="off" placeholder="e.g. TEST1001">
      </label>
      <label>
        Join code
        <input id="joinCode" autocomplete="off" placeholder="Teacher assigned">
      </label>
    </div>
    <button id="joinButton">Join</button>
    <p id="joinStatus" class="status muted"></p>
  </section>

  <section id="gamePanel" class="panel hidden v4-player-shell">
    <div class="topline">
      <div>
        <p id="playerLabel" class="eyebrow"></p>
        <h2 id="sceneTitle"></h2>
      </div>
      <button id="leaveButton" class="secondary">Switch session</button>
    </div>
    <div class="v4-runtime-grid">
    <section class="v4-region v4-scene-region" aria-label="Scene"><p class="v4-region-title">Scene · 场景</p><p id="sceneText"></p><div id="revealArea"></div></section>
    <section class="v4-region v4-action-region" aria-label="Action"><p class="v4-region-title">Action · 行动</p><div id="choiceArea"></div><p id="gameStatus" class="status muted"></p><div id="sprint3bActions"></div><p id="sprint3bStatus" class="status muted"></p></section>

    <section id="sprint3bPanel" class="story-flow hidden v4-region v4-story-region" aria-live="polite">
      <p class="eyebrow">Castle Escape Runtime</p>
      <div id="sprint3bText"></div>
    </section>

    <section class="v4-region v4-discussion-region" aria-label="Discussion"><section id="discussionPanel" class="discussion-room hidden" aria-live="polite">
      <div class="topline">
        <div>
          <p class="eyebrow">DiscussionRoom</p>
          <h3 id="discussionTopic"></h3>
        </div>
        <div id="discussionDeadline" class="deadline"></div>
      </div>
      <p id="discussionMeta" class="muted"></p>
      <div id="initialChoiceArea"></div>
      <div id="transcript" class="transcript"></div>
      <div id="messageComposer" class="composer hidden">
        <label class="sr-only" for="messageText">Message</label>
        <input id="messageText" maxlength="1000" autocomplete="off" placeholder="Write to the group">
        <button id="sendMessageButton" type="button">Send</button>
      </div>
      <div id="voteArea"></div>
      <div id="voteHistory"></div>
      <p id="discussionStatus" class="status muted"></p>
    </section><div id="sprint6DiscussionMount"></div></section>
    <aside id="pocketMount" class="v4-region v4-pocket-region" aria-label="Pocket"><p class="v4-region-title">Pocket · 随身物品</p><p class="muted">No projected items.</p></aside>
    </div>
  </section>
</main>

<script type="module" src="./src/game/app.js"></script>
</body>
</html>
