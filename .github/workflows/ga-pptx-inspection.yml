name: GA PPTX inspection
on:
  push:
    branches:
      - tooling/ga-pptx-inspection-20261004

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract slide text and geometry
        shell: python
        run: |
          import zipfile, xml.etree.ElementTree as ET, re, os, struct

          pptx = "agent-comms/第一轮测试问题截图.pptx"
          NS = {
              "p":"http://schemas.openxmlformats.org/presentationml/2006/main",
              "a":"http://schemas.openxmlformats.org/drawingml/2006/main",
              "r":"http://schemas.openxmlformats.org/officeDocument/2006/relationships",
              "pr":"http://schemas.openxmlformats.org/package/2006/relationships",
          }
          EMU = 914400.0

          def natural_key(s):
              return [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", s)]

          def bbox(el):
              xfrm = el.find(".//a:xfrm", NS)
              if xfrm is None:
                  return None
              off = xfrm.find("a:off", NS)
              ext = xfrm.find("a:ext", NS)
              if off is None or ext is None:
                  return None
              try:
                  return tuple(round(int(v)/EMU, 2) for v in (
                      off.attrib.get("x","0"), off.attrib.get("y","0"),
                      ext.attrib.get("cx","0"), ext.attrib.get("cy","0")
                  ))
              except Exception:
                  return None

          def image_dims(data):
              try:
                  if data[:8] == b"\x89PNG\r\n\x1a\n":
                      w,h = struct.unpack(">II", data[16:24]); return f"{w}x{h}"
                  if data[:2] == b"\xff\xd8":
                      i=2
                      while i+9 < len(data):
                          if data[i] != 0xFF:
                              i += 1; continue
                          marker = data[i+1]; i += 2
                          if marker in (0xD8,0xD9): continue
                          if i+2 > len(data): break
                          seglen = struct.unpack(">H", data[i:i+2])[0]
                          if marker in list(range(0xC0,0xC4))+list(range(0xC5,0xC8))+list(range(0xC9,0xCC))+list(range(0xCD,0xD0)):
                              if i+7 <= len(data):
                                  h,w = struct.unpack(">HH", data[i+3:i+7]); return f"{w}x{h}"
                          i += seglen
              except Exception:
                  pass
              return "?"

          with zipfile.ZipFile(pptx) as z:
              names = z.namelist()
              slides = sorted([n for n in names if re.fullmatch(r"ppt/slides/slide\d+\.xml", n)], key=natural_key)
              print("REPORT_START")
              print(f"# PPTX inspection: {pptx}")
              print(f"Slides: {len(slides)}")
              for slide in slides:
                  n = re.search(r"slide(\d+)\.xml", slide).group(1)
                  root = ET.fromstring(z.read(slide))
                  relpath = f"ppt/slides/_rels/slide{n}.xml.rels"
                  relmap = {}
                  if relpath in names:
                      rr = ET.fromstring(z.read(relpath))
                      for rel in rr:
                          rid = rel.attrib.get("Id")
                          target = rel.attrib.get("Target")
                          if rid and target:
                              relmap[rid]=target
                  print(f"\n## Slide {n}")
                  texts=[]
                  for el in root.iter():
                      tag = el.tag.split("}")[-1]
                      if tag in ("sp","pic","graphicFrame"):
                          runs = [t.text or "" for t in el.findall(".//a:t", NS)]
                          txt = " ".join(x.strip() for x in runs if x.strip()).strip()
                          bb = bbox(el)
                          if txt:
                              print(f"- TEXT bbox={bb}: {txt}")
                          if tag == "pic":
                              blip = el.find(".//a:blip", NS)
                              if blip is not None:
                                  rid = blip.attrib.get("{%s}embed" % NS["r"])
                                  target = relmap.get(rid)
                                  if target:
                                      media = os.path.normpath(os.path.join("ppt/slides", target)).replace("\\","/")
                                      try:
                                          data=z.read(media); dims=image_dims(data); size=len(data)
                                      except Exception:
                                          dims="?"; size=-1
                                      print(f"- IMAGE bbox={bb}: {media} dims={dims} bytes={size}")
                  note = f"ppt/notesSlides/notesSlide{n}.xml"
                  if note in names:
                      nr=ET.fromstring(z.read(note))
                      nt=" ".join((t.text or "").strip() for t in nr.findall(".//a:t", NS) if (t.text or "").strip())
                      if nt:
                          print(f"- NOTES: {nt}")
              print("\nREPORT_END")
