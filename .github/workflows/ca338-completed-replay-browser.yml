name: CA338 completed replay browser

on:
  push:
    branches: [remediation/sprint9-structural-v1]
    paths:
      - src/game/app.js
      - src/styles/app.css
      - tests/ca338-completed-replay-browser.mjs
      - tests/ca338-completed-replay-static-check.js
      - tests/ca338-main-gate-v3-static-check.js
      - tests/ca338-main-gate-v3-browser.mjs
      - tests/ca338-first-join-diagnostic-browser.mjs
      - tests/ca341-library-image-static-check.js
      - tests/ca341-library-image-browser.mjs
      - tests/v4-player-integrated-runtime-browser.mjs
      - tests/helpers/v4-two-scene-pilot-driver.js
      - tests/teacher-v5-pages-module-closure.test.mjs
      - src/content/runtime-page-text.generated.js
      - assets/asset-registry.json
      - assets/staging/shared.library/variants/hidden_door_ajar/**
      - assets/staging/shared.main_gate/v003/**
      - .github/workflows/ca338-completed-replay-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          node tests/ca338-completed-replay-static-check.js
          node tests/ca338-main-gate-v3-static-check.js
          node tests/ca341-library-image-static-check.js
          node tests/sprint8-static-check.js
          node tests/v4-player-integration-static-check.js
          node tests/teacher-v5-pages-module-closure.test.mjs
      - name: Install disposable browser dependency
        run: npm install --prefix "$RUNNER_TEMP/ca338" playwright@latest
      - name: Install Chromium
        run: $RUNNER_TEMP/ca338/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser checks
        run: |
          NODE_PATH="$RUNNER_TEMP/ca338/node_modules" node tests/ca338-completed-replay-browser.mjs
          NODE_PATH="$RUNNER_TEMP/ca338/node_modules" node tests/ca338-main-gate-v3-browser.mjs
          NODE_PATH="$RUNNER_TEMP/ca338/node_modules" node tests/ca338-first-join-diagnostic-browser.mjs
          NODE_PATH="$RUNNER_TEMP/ca338/node_modules" node tests/ca341-library-image-browser.mjs
      - name: GA-152 integrated Runtime browser
        timeout-minutes: 8
        run: NODE_PATH="$RUNNER_TEMP/ca338/node_modules" node tests/v4-player-integrated-runtime-browser.mjs
