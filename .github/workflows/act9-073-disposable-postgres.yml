name: ACT9 073 disposable PostgreSQL gate

on:
  push:
    branches:
      - remediation/sprint9-structural-v1
    paths:
      - database/073_act9_normal_teacher_paced_vote.sql
      - tests/act9-073-postgresql-transaction.sql
      - .github/workflows/act9-073-disposable-postgres.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: act9-073-disposable-postgres
  cancel-in-progress: false

jobs:
  transaction-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: act9gate
          POSTGRES_PASSWORD: act9-ephemeral-only
          POSTGRES_DB: act9gate
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U act9gate -d act9gate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: act9gate
      PGPASSWORD: act9-ephemeral-only
      PGDATABASE: act9gate
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap disposable Supabase-compatible roles
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if; if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if; if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if; end \$\$;"
          psql -X -v ON_ERROR_STOP=1 -c "create schema if not exists storage; create table if not exists storage.buckets(id text primary key,name text not null,public boolean not null default false,file_size_limit bigint,allowed_mime_types text[]);"

      - name: Apply immutable migration history 001 through 072
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          count=0
          while IFS= read -r file; do
            name="${file##*/}"
            if [[ "$name" =~ ^([0-9]{3})([^0-9].*)?\.sql$ ]]; then
              migration_number=$((10#${BASH_REMATCH[1]}))
              if (( migration_number < 1 || migration_number > 72 )); then continue; fi
              echo "MIGRATION_APPLY: $name"
              psql -X -v ON_ERROR_STOP=1 -q -f "$file"
              count=$((count+1))
            fi
          done < <(find database -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort)
          echo "BASELINE_MIGRATIONS_APPLIED=$count"
          psql -X -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.s6_get_player_state_pre072(text,text)') as pre072_dependency;"

      - name: Apply migration 073 and run rollback transaction matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "MIGRATION_APPLY: 073_act9_normal_teacher_paced_vote.sql"
          psql -X -v ON_ERROR_STOP=1 -f database/073_act9_normal_teacher_paced_vote.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/act9-073-postgresql-transaction.sql

      - name: Confirm transaction fixture teardown
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -v ON_ERROR_STOP=1 -Atc "select count(*) from public.s1_rooms where room_code in ('ACT973N','ACT973A');")" = "0"
          echo "ACT9_073_FIXTURE_TEARDOWN_PASS"
